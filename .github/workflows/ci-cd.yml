name: CI/CD Pipeline - Core Service

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      # ── Stage 1: Build & Assemble ─────────────────────────
      - name: Build & Assemble JARs
        run: ./gradlew assemble --no-daemon

      # ── Stage 2: Test & Coverage ──────────────────────────
      - name: Run Test Suites
        run: ./gradlew test --no-daemon

      - name: Generate Coverage Report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coreservice-test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 7

      # ── Stage 3: Publish to GitHub Packages ────────────────
      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GPR_REPO_URL: "https://maven.pkg.github.com/${{ github.repository }}"
        run: ./gradlew publish --no-daemon

      # ── Stage 4: Failure Notification ─────────────────────
      - name: Get Last Committer Info
        if: failure()
        id: committer
        run: |
          COMMITTER_EMAIL="${{ github.event.head_commit.author.email }}"
          COMMITTER_NAME="${{ github.event.head_commit.author.name }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          
          if [ -z "$COMMITTER_EMAIL" ]; then
            COMMITTER_EMAIL=$(git log -1 --pretty=format:'%ae')
          fi
          if [ -z "$COMMITTER_NAME" ]; then
            COMMITTER_NAME=$(git log -1 --pretty=format:'%an')
          fi
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          fi
          
          echo "email=$COMMITTER_EMAIL" >> $GITHUB_OUTPUT
          echo "name=$COMMITTER_NAME" >> $GITHUB_OUTPUT
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Send Failure Notification Email
        if: failure() && env.SMTP_SERVER != '' && steps.committer.outputs.email != ''
        uses: dawidd6/action-send-mail@v3
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "🚨 [CI/CD FAILED] ${{ github.repository }} (${{ github.ref_name }})"
          to: ${{ steps.committer.outputs.email }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: |
            CI/CD Pipeline Failure Notification

            Repository: ${{ github.repository }}
            Branch:     ${{ github.ref_name }}
            Workflow:   ${{ github.workflow }}
            Run Number: #${{ github.run_number }}

            Committer:  ${{ steps.committer.outputs.name }} <${{ steps.committer.outputs.email }}>
            Commit SHA: ${{ github.sha }}
            Message:    ${{ steps.committer.outputs.message }}

            View detailed run log:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Fallback Notification Info
        if: failure() && env.SMTP_SERVER == ''
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        run: |
          echo "::warning title=SMTP Not Configured::SMTP_SERVER secret is not configured. Failure notification email was skipped."
          echo "To enable failure email alerts to committers, configure secrets: SMTP_SERVER, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD."
          echo "Target Committer: ${{ steps.committer.outputs.name }} <${{ steps.committer.outputs.email }}>"
